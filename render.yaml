services:
  - type: web
    name: hsc-backend-test
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: PUBLIC_ORIGIN
        sync: false
      - key: TEST_USERNAME
        sync: false
      - key: TEST_PASSWORD
        sync: false
      - key: MAX_SESSIONS
        value: "1"
