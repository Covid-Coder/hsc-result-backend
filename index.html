<!doctype html><html lang="bn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ফলাফল দেখুন</title><style>*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;padding:24px 12px;background:#edf6f5;color:#173b3a;font:18px/1.6 'Nirmala UI',sans-serif}main{max-width:820px;margin:auto;background:white;padding:28px;border-radius:16px}h1{text-align:center;font-size:clamp(1.5rem,5vw,2rem)}button,input,a{font:inherit}button,.back{padding:10px 16px;border:0;border-radius:6px;background:#08766b;color:white;cursor:pointer;text-decoration:none}button:disabled{opacity:.5;cursor:wait}input{display:block;width:100%;padding:12px;border:1px solid #8ba9a6;border-radius:6px;margin:8px 0 18px}#screen{width:100%;height:auto;border:1px solid #8ba9a6;cursor:pointer}#captcha-picture{display:block;min-width:160px;max-width:100%;height:auto;margin:16px 0}#result-text{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:20px}#summary{text-align:center;background:#edf6f5;padding:12px;border-radius:8px}.note{font-size:.9em}details{margin:12px 0}label{display:block;margin-top:12px}#reload-captcha{margin-bottom:12px}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #d99300}@media(max-width:500px){main{padding:20px 16px}.actions>*{width:100%;text-align:center}}#status,#captcha-step,.note{text-align:center}#captcha-picture{margin:16px auto}#captcha{max-width:420px;margin:8px auto 18px;text-align:center}.actions{justify-content:center}</style>
<main><h1>পরীক্ষার ফলাফল</h1><p id="summary" hidden></p><p id="status" role="status" aria-live="polite">সংযোগ হচ্ছে…</p>
<section id="verification" hidden><h2>যাচাই সম্পন্ন করুন</h2><p>নিচের সরকারি পৃষ্ঠার যাচাইটি নিজে সম্পন্ন করুন।</p><img id="screen" alt="সরকারি সাইটের যাচাই" width="1100" height="850"><details><summary>যাচাইয়ের জন্য লেখা বা keyboard দরকার হলে</summary><label>নির্বাচিত ঘরে পাঠানোর লেখা<input id="verification-text"></label><button id="type">লেখা পাঠান</button><button data-key="Tab">Tab</button><button data-key="Enter">Enter</button><button data-key="ArrowDown">↓</button></details></section>
<section id="captcha-step" hidden><h2>CAPTCHA লিখুন</h2><img id="captcha-picture" alt="সরকারি সাইটের CAPTCHA"><button id="reload-captcha" type="button">অন্য ছবি দেখুন</button><label for="captcha">ছবিতে দেখা সংখ্যাগুলো লিখুন</label><input id="captcha" inputmode="numeric" autocomplete="off"><button id="submit" type="button">ফলাফল দেখুন</button></section>
<section id="result" hidden><h2>সরকারি সাইটের উত্তর</h2><pre id="result-text"></pre><button id="retry-captcha" hidden>CAPTCHA আবার লিখুন</button></section>
<div class="actions"><button id="retry" hidden>আবার সংযোগ করুন</button><a class="back" id="edit" href="https://covid-coder.github.io/hsc-result-checker/index.html?v=simple-1">তথ্য সম্পাদনা করুন</a></div><p class="note">Verification ও CAPTCHA আপনিই পূরণ করবেন।</p></main><script src="app.js?v=result-2"></script></html>
